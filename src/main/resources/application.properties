spring.application.name=${SPRING_APPLICATION_NAME}

server.port=${PORT:10000}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# Swagger
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}

# RENIEC
reniec.api.url=${RENIEC_API_URL}

# RESEND
resend.api.url=${RESEND_API_URL}
resend.api.key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

# FRONTEND
app.frontend.url=${APP_FRONTEND_URL}

# CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

cloudinary.folder-perfiles=${CLOUDINARY_FOLDER_PERFILES}
cloudinary.folder-sedes=${CLOUDINARY_FOLDER_SEDES}
cloudinary.folder-documentos-clinicos=${CLOUDINARY_FOLDER_DOCUMENTOS_CLINICOS}